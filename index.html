<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аделіна — Мій прикорм</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #fff8fb;
  color: #5f5360;
}

header {
  background: linear-gradient(135deg, #f9dfe9, #e9e3f8);
  padding: 24px 16px;
  text-align: center;
  border-radius: 0 0 28px 28px;
}

header h1 {
  margin: 0;
  color: #6c5b70;
  font-size: 25px;
}

header p {
  margin: 7px 0 0;
  font-size: 14px;
  color: #887789;
}

nav {
  display: flex;
  overflow-x: auto;
  gap: 8px;
  padding: 12px;
  background: white;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid #f0e6ed;
}

nav button {
  flex: 0 0 auto;
  border: none;
  background: #f8eef4;
  color: #756577;
  padding: 10px 13px;
  border-radius: 18px;
  font-size: 13px;
}

nav button.active {
  background: #e8d9ee;
  color: #624d68;
  font-weight: 600;
}

main {
  padding: 16px;
  max-width: 700px;
  margin: auto;
}

.section {
  display: none;
}

.section.active {
  display: block;
}

h2 {
  color: #69596d;
  margin-top: 8px;
}

h3 {
  color: #766477;
  margin-bottom: 10px;
}

/* SEARCH */

.search-box {
  position: relative;
  margin: 15px 0 10px;
}

.search-box input {
  width: 100%;
  padding: 13px 16px;
  border: 1px solid #eadde6;
  border-radius: 18px;
  background: white;
  font-size: 15px;
  outline: none;
}

.search-box input:focus {
  border-color: #d9c4df;
}

/* FILTERS */

.filters {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 4px 0 14px;
}

.filters button {
  white-space: nowrap;
  border: none;
  background: #f4edf5;
  color: #746478;
  padding: 9px 13px;
  border-radius: 16px;
  font-size: 13px;
}

.filters button.active {
  background: #d9c8e2;
  color: #5c4962;
  font-weight: 600;
}

/* FOOD CARDS */

.category {
  margin-bottom: 24px;
}

.category-title {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 18px;
  margin-bottom: 10px;
}

.food-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.food-card {
  background: white;
  border-radius: 20px;
  padding: 13px;
  border: 1px solid #f0e4eb;
  box-shadow: 0 3px 12px rgba(120, 90, 110, 0.05);
  min-height: 105px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.food-card.introduced {
  background: #f5f9f2;
  border-color: #dcebd6;
}

.food-top {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  align-items: flex-start;
}

.food-emoji {
  font-size: 27px;
}

.food-name {
  font-size: 15px;
  font-weight: 600;
  color: #655767;
  line-height: 1.25;
  margin-top: 6px;
}

.allergen-badge {
  font-size: 10px;
  background: #f8e1e5;
  color: #a06470;
  padding: 4px 7px;
  border-radius: 10px;
  white-space: nowrap;
}

.food-card label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: #87798a;
  margin-top: 9px;
}

.food-card input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: #b99fc0;
}

/* GENERAL */

.card {
  background: white;
  padding: 16px;
  border-radius: 20px;
  margin-bottom: 14px;
  border: 1px solid #f0e4eb;
  box-shadow: 0 3px 12px rgba(120, 90, 110, 0.05);
}

button.primary {
  border: none;
  background: #d9c8e2;
  color: #5d4c64;
  padding: 11px 17px;
  border-radius: 16px;
  font-size: 14px;
}

button.delete {
  border: none;
  background: #f8e1e5;
  color: #a15d69;
  padding: 8px 12px;
  border-radius: 13px;
}

button.edit {
  border: none;
  background: #eee6f4;
  color: #705d78;
  padding: 8px 12px;
  border-radius: 13px;
  margin-right: 5px;
}

/* DIARY */

.form-group {
  margin-bottom: 12px;
}

.form-group label {
  display: block;
  font-size: 13px;
  margin-bottom: 5px;
  color: #766477;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  border: 1px solid #eadde6;
  border-radius: 14px;
  padding: 11px;
  font-size: 14px;
  background: #fff;
  font-family: inherit;
}

.form-group textarea {
  min-height: 75px;
  resize: vertical;
}

.diary-photo {
  width: 100%;
  max-height: 230px;
  object-fit: cover;
  border-radius: 16px;
  margin-top: 10px;
}

.entry-buttons {
  margin-top: 12px;
}

/* ALLERGENS */

.allergen-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 13px;
  margin-bottom: 8px;
  background: white;
  border-radius: 16px;
  border: 1px solid #f0e4eb;
}

.allergen-item-left {
  display: flex;
  align-items: center;
  gap: 9px;
}

.allergen-item input {
  width: 18px;
  height: 18px;
  accent-color: #b99fc0;
}

/* CALENDAR / STATS */

.date-group {
  margin-bottom: 18px;
}

.date-title {
  font-weight: 600;
  color: #705f73;
  margin-bottom: 8px;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.stat-card {
  background: white;
  border-radius: 20px;
  padding: 18px 12px;
  text-align: center;
  border: 1px solid #f0e4eb;
}

.stat-number {
  font-size: 28px;
  font-weight: 700;
  color: #806b84;
}

.stat-label {
  font-size: 12px;
  color: #8c7d8e;
  margin-top: 4px;
}

.empty {
  text-align: center;
  padding: 25px 10px;
  color: #9b8d9d;
}

.small-note {
  font-size: 12px;
  color: #9a8c9d;
  line-height: 1.5;
}

@media (min-width: 600px) {
  .food-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>🌸 Аделіна — Мій прикорм</h1>
  <p>Маленькі кроки до великих відкриттів 💕</p>
</header>

<nav>
  <button class="active" onclick="showSection('home', this)">🏠 Головна</button>
  <button onclick="showSection('allergens', this)">🥜 Алергени</button>
  <button onclick="showSection('diary', this)">📖 Щоденник</button>
  <button onclick="showSection('calendar', this)">📅 Календар</button>
  <button onclick="showSection('stats', this)">📊 Статистика</button>
</nav>

<main>

<!-- HOME -->

<section id="home" class="section active">

  <h2>🥣 Продукти</h2>

  <div class="search-box">
    <input
      type="text"
      id="foodSearch"
      placeholder="🔍 Пошук продукту..."
      oninput="renderFoods()"
    >
  </div>

  <div class="filters">
    <button class="active" onclick="setFilter('all', this)">Усі</button>
    <button onclick="setFilter('notIntroduced', this)">Не введені</button>
    <button onclick="setFilter('introduced', this)">Введені</button>
    <button onclick="setFilter('allergen', this)">Алергени</button>
  </div>

  <div id="foodContainer"></div>

</section>


<!-- ALLERGENS -->

<section id="allergens" class="section">

  <h2>🥜 Алергени</h2>

  <div class="card">
    <p class="small-note">
      Тут можна окремо відмічати алергени, які вже були введені.
    </p>
  </div>

  <div id="allergenContainer"></div>

</section>


<!-- DIARY -->

<section id="diary" class="section">

  <h2>📖 Щоденник</h2>

  <div class="card">

    <div class="form-group">
      <label>Дата</label>
      <input type="date" id="diaryDate">
    </div>

    <div class="form-group">
      <label>Продукт</label>
      <input
        type="text"
        id="diaryProduct"
        placeholder="Наприклад: кабачок"
      >
    </div>

    <div class="form-group">
      <label>Кількість</label>
      <input
        type="text"
        id="diaryAmount"
        placeholder="Наприклад: 2 чайні ложки"
      >
    </div>

    <div class="form-group">
      <label>Реакція</label>
      <select id="diaryReaction">
        <option>Все добре 🌸</option>
        <option>Без реакції 🙂</option>
        <option>Потрібно спостерігати 👀</option>
        <option>Була реакція ⚠️</option>
      </select>
    </div>

    <div class="form-group">
      <label>Нотатки</label>
      <textarea
        id="diaryNotes"
        placeholder="Наприклад: їла із задоволенням..."
      ></textarea>
    </div>

    <div class="form-group">
      <label>Фото</label>
      <input type="file" id="diaryPhoto" accept="image/*">
    </div>

    <button class="primary" onclick="saveDiaryEntry()">
      💾 Зберегти запис
    </button>

  </div>

  <div id="diaryContainer"></div>

</section>


<!-- CALENDAR -->

<section id="calendar" class="section">

  <h2>📅 Календар</h2>

  <div id="calendarContainer"></div>

</section>


<!-- STATS -->

<section id="stats" class="section">

  <h2>📊 Статистика</h2>

  <div class="stat-grid">

    <div class="stat-card">
      <div class="stat-number" id="statIntroduced">0</div>
      <div class="stat-label">Введено продуктів</div>
    </div>

    <div class="stat-card">
      <div class="stat-number" id="statTotal">0</div>
      <div class="stat-label">Усього продуктів</div>
    </div>

    <div class="stat-card">
      <div class="stat-number" id="statAllergens">0</div>
      <div class="stat-label">Введено алергенів</div>
    </div>

    <div class="stat-card">
      <div class="stat-number" id="statDiary">0</div>
      <div class="stat-label">Записів у щоденнику</div>
    </div>

  </div>

</section>

</main>


<script>

const foods = [

  {
    category: "🥦 Овочі",
    emoji: "🥦",
    items: [
      ["Кабачок", false],
      ["Броколі", false],
      ["Цвітна капуста", false],
      ["Морква", false],
      ["Гарбуз", false],
      ["Батат", false],
      ["Картопля", false],
      ["Зелений горошок", false],
      ["Авокадо", false]
    ]
  },

  {
    category: "🍎 Фрукти та ягоди",
    emoji: "🍎",
    items: [
      ["Яблуко", false],
      ["Груша", false],
      ["Банан", false],
      ["Персик", false],
      ["Нектарин", false],
      ["Абрикос", false],
      ["Слива", false],
      ["Манго", false],
      ["Полуниця", true],
      ["Малина", true],
      ["Чорниця", false]
    ]
  },

  {
    category: "🌾 Крупи та каші",
    emoji: "🌾",
    items: [
      ["Рис", false],
      ["Гречка", false],
      ["Вівсянка", false],
      ["Кукурудзяна крупа", false],
      ["Пшоно", false],
      ["Пшениця", true],
      ["Ячмінь", true]
    ]
  },

  {
    category: "🥩 М'ясо",
    emoji: "🥩",
    items: [
      ["Курка", false],
      ["Індичка", false],
      ["Кролик", false],
      ["Яловичина", false],
      ["Телятина", false]
    ]
  },

  {
    category: "🐟 Риба та морепродукти",
    emoji: "🐟",
    items: [
      ["Лосось", true],
      ["Тріска", true],
      ["Хек", true],
      ["Форель", true],
      ["Креветки", true]
    ]
  },

  {
    category: "🥚 Яйця",
    emoji: "🥚",
    items: [
      ["Куряче яйце", true]
    ]
  },

  {
    category: "🥛 Молочні продукти",
    emoji: "🥛",
    items: [
      ["Натуральний йогурт", false],
      ["Сир", false],
      ["Коров'яче молоко", true]
    ]
  },

  {
    category: "🥜 Бобові та горіхи",
    emoji: "🥜",
    items: [
      ["Чечевиця", false],
      ["Нут", false],
      ["Арахіс", true],
      ["Мигдаль", true],
      ["Кеш'ю", true],
      ["Волоський горіх", true]
    ]
  }

];


const allergenFoods = [
  "Куряче яйце",
  "Арахіс",
  "Мигдаль",
  "Кеш'ю",
  "Волоський горіх",
  "Пшениця",
  "Ячмінь",
  "Коров'яче молоко",
  "Лосось",
  "Тріска",
  "Хек",
  "Форель",
  "Креветки",
  "Полуниця",
  "Малина"
];


let introducedFoods =
  JSON.parse(localStorage.getItem("introducedFoods")) || [];

let introducedAllergens =
  JSON.parse(localStorage.getItem("introducedAllergens")) || [];

let diaryEntries =
  JSON.parse(localStorage.getItem("diaryEntries")) || [];

let currentFilter = "all";

let editingDiaryId = null;


/* NAVIGATION */

function showSection(id, button) {

  document.querySelectorAll(".section").forEach(section => {
    section.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  document.querySelectorAll("nav button").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");

  if (id === "stats") {
    renderStats();
  }

  if (id === "calendar") {
    renderCalendar();
  }

}


/* FILTER */

function setFilter(filter, button) {

  currentFilter = filter;

  document.querySelectorAll(".filters button").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");

  renderFoods();

}


/* FOOD LIST */

function renderFoods() {

  const container =
    document.getElementById("foodContainer");

  const search =
    document.getElementById("foodSearch").value
      .toLowerCase()
      .trim();

  container.innerHTML = "";

  let totalVisible = 0;

  foods.forEach(category => {

    const visibleItems = category.items.filter(item => {

      const name = item[0];
      const allergen = item[1];

      const matchesSearch =
        name.toLowerCase().includes(search);

      const isIntroduced =
        introducedFoods.includes(name);

      let matchesFilter = true;

      if (currentFilter === "introduced") {
        matchesFilter = isIntroduced;
      }

      if (currentFilter === "notIntroduced") {
        matchesFilter = !isIntroduced;
      }

      if (currentFilter === "allergen") {
        matchesFilter = allergen;
      }

      return matchesSearch && matchesFilter;

    });

    if (visibleItems.length === 0) {
      return;
    }

    totalVisible += visibleItems.length;

    const categoryDiv =
      document.createElement("div");

    categoryDiv.className = "category";

    categoryDiv.innerHTML =
      `<div class="category-title">
        ${category.category}
      </div>`;

    const grid =
      document.createElement("div");

    grid.className = "food-grid";

    visibleItems.forEach(item => {

      const name = item[0];
      const allergen = item[1];

      const isIntroduced =
        introducedFoods.includes(name);

      const card =
        document.createElement("div");

      card.className =
        "food-card" +
        (isIntroduced ? " introduced" : "");

      card.innerHTML = `

        <div class="food-top">

          <div class="food-emoji">
            ${category.emoji}
          </div>

          ${
            allergen
            ? `<span class="allergen-badge">Алерген</span>`
            : ""
          }

        </div>

        <div class="food-name">
          ${name}
        </div>

        <label>

          <input
            type="checkbox"
            ${isIntroduced ? "checked" : ""}
            onchange="toggleFood('${escapeQuotes(name)}')"
          >

          ${isIntroduced ? "Введено 🌸" : "Ще не введено"}

        </label>
      `;

      grid.appendChild(card);

    });

    categoryDiv.appendChild(grid);

    container.appendChild(categoryDiv);

  });


  if (totalVisible === 0) {

    container.innerHTML = `
      <div class="empty">
        🌸 Нічого не знайдено
      </div>
    `;

  }

}


/* FOOD CHECKBOX */

function toggleFood(name) {

  if (introducedFoods.includes(name)) {

    introducedFoods =
      introducedFoods.filter(item => item !== name);

  } else {

    introducedFoods.push(name);

  }

  localStorage.setItem(
    "introducedFoods",
    JSON.stringify(introducedFoods)
  );

  renderFoods();
  renderAllergens();
  renderStats();

}


/* ALLERGENS */

function renderAllergens() {

  const container =
    document.getElementById("allergenContainer");

  container.innerHTML = "";

  allergenFoods.forEach(name => {

    const checked =
      introducedAllergens.includes(name);

    const item =
      document.createElement("div");

    item.className = "allergen-item";

    item.innerHTML = `

      <div class="allergen-item-left">

        <input
          type="checkbox"
          ${checked ? "checked" : ""}
          onchange="toggleAllergen('${escapeQuotes(name)}')"
        >

        <span>${name}</span>

      </div>

      <span>🥜</span>
    `;

    container.appendChild(item);

  });

}


function toggleAllergen(name) {

  if (introducedAllergens.includes(name)) {

    introducedAllergens =
      introducedAllergens.filter(item => item !== name);

  } else {

    introducedAllergens.push(name);

  }

  localStorage.setItem(
    "introducedAllergens",
    JSON.stringify(introducedAllergens)
  );

  renderAllergens();
  renderStats();

}


/* DIARY */

function saveDiaryEntry() {

  const date =
    document.getElementById("diaryDate").value;

  const product =
    document.getElementById("diaryProduct").value.trim();

  const amount =
    document.getElementById("diaryAmount").value.trim();

  const reaction =
    document.getElementById("diaryReaction").value;

  const notes =
    document.getElementById("diaryNotes").value.trim();

  const photoInput =
    document.getElementById("diaryPhoto");

  if (!date || !product) {

    alert("Будь ласка, вкажи дату та продукт 🌸");
    return;

  }

  if (photoInput.files.length > 0) {

    const reader =
      new FileReader();

    reader.onload = function(e) {

      finishDiarySave(
        date,
        product,
        amount,
        reaction,
        notes,
        e.target.result
      );

    };

    reader.readAsDataURL(photoInput.files[0]);

  } else {

    finishDiarySave(
      date,
      product,
      amount,
      reaction,
      notes,
      null
    );

  }

}


function finishDiarySave(
  date,
  product,
  amount,
  reaction,
  notes,
  photo
) {

  if (editingDiaryId) {

    const entry =
      diaryEntries.find(
        item => item.id === editingDiaryId
      );

    if (entry) {

      entry.date = date;
      entry.product = product;
      entry.amount = amount;
      entry.reaction = reaction;
      entry.notes = notes;

      if (photo) {
        entry.photo = photo;
      }

    }

    editingDiaryId = null;

  } else {

    diaryEntries.push({

      id: Date.now(),

      date,
      product,
      amount,
      reaction,
      notes,
      photo

    });

  }

  localStorage.setItem(
    "diaryEntries",
    JSON.stringify(diaryEntries)
  );

  clearDiaryForm();
  renderDiary();
  renderCalendar();
  renderStats();

}


function clearDiaryForm() {

  document.getElementById("diaryDate").value = "";
  document.getElementById("diaryProduct").value = "";
  document.getElementById("diaryAmount").value = "";
  document.getElementById("diaryReaction").selectedIndex = 0;
  document.getElementById("diaryNotes").value = "";
  document.getElementById("diaryPhoto").value = "";

}


function renderDiary() {

  const container =
    document.getElementById("diaryContainer");

  container.innerHTML = "";

  if (diaryEntries.length === 0) {

    container.innerHTML = `
      <div class="empty">
        📖 Поки що записів немає
      </div>
    `;

    return;

  }

  const sorted =
    [...diaryEntries].sort(
      (a, b) =>
        new Date(b.date) - new Date(a.date)
    );

  sorted.forEach(entry => {

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <h3>🌸 ${entry.product}</h3>

      <p><b>Дата:</b> ${formatDate(entry.date)}</p>

      ${
        entry.amount
        ? `<p><b>Кількість:</b> ${entry.amount}</p>`
        : ""
      }

      <p><b>Реакція:</b> ${entry.reaction}</p>

      ${
        entry.notes
        ? `<p><b>Нотатки:</b> ${entry.notes}</p>`
        : ""
      }

      ${
        entry.photo
        ? `<img
            class="diary-photo"
            src="${entry.photo}"
          >`
        : ""
      }

      <div class="entry-buttons">

        <button
          class="edit"
          onclick="editDiary(${entry.id})"
        >
          ✏️ Редагувати
        </button>

        <button
          class="delete"
          onclick="deleteDiary(${entry.id})"
        >
          🗑 Видалити
        </button>

      </div>
    `;

    container.appendChild(card);

  });

}


function editDiary(id) {

  const entry =
    diaryEntries.find(item => item.id === id);

  if (!entry) return;

  document.getElementById("diaryDate").value =
    entry.date;

  document.getElementById("diaryProduct").value =
    entry.product;

  document.getElementById("diaryAmount").value =
    entry.amount || "";

  document.getElementById("diaryReaction").value =
    entry.reaction;

  document.getElementById("diaryNotes").value =
    entry.notes || "";

  editingDiaryId = id;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function deleteDiary(id) {

  if (!confirm("Видалити цей запис?")) {
    return;
  }

  diaryEntries =
    diaryEntries.filter(
      item => item.id !== id
    );

  localStorage.setItem(
    "diaryEntries",
    JSON.stringify(diaryEntries)
  );

  renderDiary();
  renderCalendar();
  renderStats();

}


/* CALENDAR */

function renderCalendar() {

  const container =
    document.getElementById("calendarContainer");

  container.innerHTML = "";

  if (diaryEntries.length === 0) {

    container.innerHTML = `
      <div class="empty">
        📅 Поки що немає записів
      </div>
    `;

    return;

  }

  const grouped = {};

  diaryEntries.forEach(entry => {

    if (!grouped[entry.date]) {
      grouped[entry.date] = [];
    }

    grouped[entry.date].push(entry);

  });


  Object.keys(grouped)
    .sort()
    .reverse()
    .forEach(date => {

      const div =
        document.createElement("div");

      div.className = "date-group";

      div.innerHTML = `
        <div class="date-title">
          📅 ${formatDate(date)}
        </div>
      `;

      grouped[date].forEach(entry => {

        const card =
          document.createElement("div");

        card.className = "card";

        card.innerHTML = `
          <b>🌸 ${entry.product}</b>
          <div class="small-note">
            ${entry.reaction}
            ${
              entry.amount
              ? " · " + entry.amount
              : ""
            }
          </div>
        `;

        div.appendChild(card);

      });

      container.appendChild(div);

    });

}


/* STATS */

function renderStats() {

  const total =
    foods.reduce(
      (sum, category) =>
        sum + category.items.length,
      0
    );

  document.getElementById("statIntroduced").textContent =
    introducedFoods.length;

  document.getElementById("statTotal").textContent =
    total;

  document.getElementById("statAllergens").textContent =
    introducedAllergens.length;

  document.getElementById("statDiary").textContent =
    diaryEntries.length;

}


/* HELPERS */

function formatDate(date) {

  if (!date) return "";

  const parts =
    date.split("-");

  return `${parts[2]}.${parts[1]}.${parts[0]}`;

}


function escapeQuotes(text) {

  return text
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");

}


/* INITIAL LOAD */

document.getElementById("diaryDate").value =
  new Date().toISOString().split("T")[0];

renderFoods();
renderAllergens();
renderDiary();
renderCalendar();
renderStats();

</script>
